// Gradle configuration merged into the host app's build by Cordova
// (gradleReference). The TruID Android SDK is public on JitPack.
//
// NOTE: module namespaces (an AGP 8 requirement) are NOT set here because
// they differ per host app - the plugin's hooks/android-agp8-namespace.js
// injects them into the generated build files instead.
//
// Design rule on the modern branches: this file is merged into SOMEONE ELSE'S app
// build, so it must never downgrade a host that is already ahead, and version
// nudges are raise-only (eachDependency) rather than hard `force` pins.
//
// THIS BRANCH IS DIFFERENT. compileSdk 30 imposes a hard ceiling on AndroidX, so
// the pins below are deliberate downgrades and are NOT raise-only. That is only
// correct because the host is known to be stuck at compileSdk 30; on any host that
// can compile against API 31+, use the modern plugin branch instead.

repositories {
    google()          // also serves com.google.ai.edge.litert (16 KB-aligned TFLite)
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    // 8.1.0 is the compileSdk 30 build of the 8.0.9-beta feature set. Same fingerprint
    // behaviour - results come back through AuthenticateWithTruID.Output
    // .getFingerprints() with image and WSQ both base64, handed over in memory
    // rather than in the result intent, because a full eight finger capture parcels
    // to about 780 KB and system_server rejects it with TransactionTooLargeException.
    //
    // It is built against androidx.core 1.6.0 / activity 1.3.1 / appcompat 1.3.1 /
    // Compose 1.1.1 / CameraX 1.1.0-alpha08 so that it can be consumed at
    // compileSdk 30. This is a permanent fork of the modern line, not a successor:
    // do not use it on a host that can compile against API 31 or later.
    implementation "com.github.truid-ai:android-sdk:8.1.0"
    // TruIDPlugin.java references AuthenticateWithTruID, which extends androidx
    // activity's ActivityResultContract. The SDK scopes androidx.activity as
    // `implementation`, so it is not on the plugin's compile classpath by
    // default -> "cannot access ActivityResultContract". Add it explicitly.
    //
    // 1.3.1, NOT 1.8.2: androidx.activity 1.4.0+ implements
    // androidx.core.view.MenuHost, which only exists from core 1.7.0, and core 1.7.0
    // cannot be used at compileSdk 30 (it declares android:attr/lStar). Requesting
    // 1.8.2 here raises activity for the whole app and ComponentActivity then fails
    // verification at runtime with
    // "NoClassDefFoundError: androidx.activity.ComponentActivity".
    implementation "androidx.activity:activity:1.3.1"
    implementation "androidx.activity:activity-ktx:1.3.1"
}

// ---------------------------------------------------------------------------
// 16 KB page-size alignment (Android 15+ / Google Play requirement)
//
// The TruID SDK's own natives are already 16 KB-aligned (built with
// -Wl,-z,max-page-size=16384). Measured across a built APK, the only
// 4 KB-laid-out 64-bit libraries come from two third-party transitive deps:
//   libimage_processing_util_jni.so  <- androidx.camera:camera-core   1.3.x
//   libtensorflowlite_jni.so         <- org.tensorflow:tensorflow-lite 2.16.x
//
// Alignment CANNOT be patched into a prebuilt .so after the fact. A PT_LOAD
// must satisfy p_offset == p_vaddr (mod p_align), so rewriting p_align to
// 16384 in place without relaying out the segments produces a MALFORMED ELF:
// the audit tools report a false PASS while the loader still maps 4 KB
// offsets, and a loader that validates p_align can refuse to dlopen it. The
// only real fix is to consume upstream builds that are genuinely relaid out:
//   androidx.camera 1.4.2                    -> aligned and congruent
//   com.google.ai.edge.litert:litert 2.1.6   -> aligned, keeps the
//                                               org.tensorflow.lite.* classes
//
// Do NOT "just bump" tensorflow-lite: org.tensorflow:tensorflow-lite:2.17.0 is
// a relocation stub whose .jar is a 4 KB copy of the POM with NO native libs.
// Forcing it silently drops libtensorflowlite_jni.so -> UnsatisfiedLinkError.
//
// Gated on AGP 8.5+ (which zipaligns the APK's uncompressed .so with -P 16)
// and compileSdk 35+, i.e. the toolchain in INTEGRATION.md section 3. On older
// hosts this is a no-op and CameraX/TFLite are left exactly as the host
// resolves them. Override with -Ptruid16kb=on|off (default: auto).
//
// The decision is evaluated LAZILY, at dependency-resolution time: Cordova
// applies this file long before the generated app/build.gradle sets
// compileSdkVersion, so an apply-time read sees 0 and would silently disable
// the swap on every host.
// ---------------------------------------------------------------------------
ext.truid16kbDecision = null

def truidDecide16kb = {
    if (project.ext.truid16kbDecision != null) return project.ext.truid16kbDecision

    // An `apply from:` script's own classloader does NOT see the root
    // buildscript classpath, so Class.forName(..) alone never finds AGP. Load
    // through the android extension's classloader, which comes from AGP itself.
    def agpLoaders = []
    try { agpLoaders << android.getClass().getClassLoader() } catch (Throwable ignored) { }
    agpLoaders << getClass().getClassLoader()
    def agp = ['com.android.Version',
               'com.android.builder.model.Version'].findResult { cls ->
        agpLoaders.findResult { loader ->
            try {
                Class.forName(cls, false, loader)
                        .getField('ANDROID_GRADLE_PLUGIN_VERSION').get(null).toString()
            } catch (Throwable ignored) {
                null
            }
        }
    }

    int agpMajor = 0, agpMinor = 0
    if (agp) {
        def m = (agp =~ /^(\d+)\.(\d+)/)
        if (m.find()) {
            agpMajor = m.group(1) as int
            agpMinor = m.group(2) as int
        }
    }

    int compileSdk = 0
    try {
        def v = android.compileSdk
        if (v) compileSdk = v as int
    } catch (Throwable ignored) { }
    if (compileSdk == 0) {
        try {
            def m = (android.compileSdkVersion.toString() =~ /(\d+)/)
            if (m.find()) compileSdk = m.group(1) as int
        } catch (Throwable ignored) { }
    }

    def hostOk = (agpMajor > 8 || (agpMajor == 8 && agpMinor >= 5)) && compileSdk >= 35
    def mode = (project.findProperty('truid16kb') ?: 'auto').toString().toLowerCase()
    def use = (mode == 'on') || (mode != 'off' && hostOk)

    project.ext.truid16kbDecision = [use: use]
    println("truID: 16 KB-aligned native deps " +
            "${use ? 'ENABLED (CameraX 1.4.2, litert 2.1.6)' : 'disabled'} " +
            "(AGP ${agp ?: 'unknown'}, compileSdk ${compileSdk}, mode=${mode})")
    if (use && !hostOk) {
        // litert 2.x publishes Kotlin-Multiplatform module metadata. Gradle < 7
        // cannot serialize the resulting resolution result and fails with
        // "Corrupt serialized resolution result ... desktopRuntimeElements-published
        // -> androidx.lifecycle:lifecycle-runtime-ktx", which looks nothing like
        // the real cause. Warn rather than let someone hunt that down.
        println("truID: WARNING -Ptruid16kb=on was forced on an unsupported host " +
                "(needs AGP 8.5+ and compileSdk 35+). Expect resolution failures; " +
                "on Gradle 6.x litert's module metadata breaks dependency resolution outright.")
    }
    return project.ext.truid16kbDecision
}

def truidMajorOf = { String v ->
    def m = (v =~ /^(\d+)/)
    m.find() ? (m.group(1) as int) : 0
}

def truidCameraArtifacts = ['camera-core', 'camera-camera2', 'camera-lifecycle',
                            'camera-view', 'camera-video']

configurations.all {
    resolutionStrategy {
        eachDependency { details ->
            def req = details.requested

            // TruID SDK 8.0.5+ calls the lottie-compose 6.x LottieAnimation
            // overload; an older transitive 5.x gives NoSuchMethodError at
            // runtime. Raise-only, so a host already on 6.x/7.x is untouched.
            if (req.group == 'com.airbnb.android'
                    && (req.name == 'lottie' || req.name == 'lottie-compose')) {
                if (truidMajorOf(req.version) in 1..5) {
                    details.useVersion('6.0.0')
                    details.because('truID SDK 8.0.5+ needs the lottie-compose 6.x LottieAnimation overload')
                }
                return
            }

            if (!truidDecide16kb().use) return

            if (req.group == 'androidx.camera' && truidCameraArtifacts.contains(req.name)) {
                // Raise-only: never pull a host back from a newer CameraX.
                def m = (req.version =~ /^(\d+)\.(\d+)/)
                def older = true
                if (m.find()) {
                    int maj = m.group(1) as int
                    int min = m.group(2) as int
                    older = (maj < 1) || (maj == 1 && min < 4)
                }
                if (older) {
                    details.useVersion('1.4.2')
                    details.because('truID: CameraX 1.4.2 ships 16 KB-aligned natives')
                }
            } else if (req.group == 'org.tensorflow' && req.name == 'tensorflow-lite') {
                details.useTarget('com.google.ai.edge.litert:litert:2.1.6')
                details.because('truID: 16 KB-aligned TFLite; tensorflow-lite 2.17.0 is a stub with no .so')
            }
        }
    }
}

// Do NOT call android { } at the top level here. Cordova decides where in the
// generated app/build.gradle this file gets applied, and on some hosts that is
// before `apply plugin: 'com.android.application'`, at which point the android
// extension does not exist yet and Gradle fails the whole build with:
//
//   No signature of method: build_xxxxx.android() is applicable for argument
//   types: (build_xxxxx$_run_closure7)
//
// withId() runs the block immediately when the plugin is already applied, and
// defers it until it is otherwise, so the ordering stops mattering.
project.plugins.withId('com.android.application') {
    android {
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
        // The SDK embeds OpenCV natives and also pulls quickbirdstudios:opencv
        // transitively; both ship the same .so. Keep one copy instead of failing
        // the merge. (`packagingOptions` is the spelling that works on AGP 7 & 8.)
        packagingOptions {
            pickFirst 'lib/**/libc++_shared.so'
            pickFirst 'lib/**/libopencv_java4.so'
            pickFirst 'lib/**/libopencv_info.so'
        }
    }
}

// ---------------------------------------------------------------------------
// compileSdk 30 compatibility
//
// AGP 4.1 introduced checkDebugAarMetadata, which enforces every AAR's declared
// minCompileSdk in the APPLICATION module. Compose 1.1.1, lifecycle 2.4.0 and
// navigation 2.4.2 declare minCompileSdk=31, so the host build fails before it
// compiles anything. None of them actually references an API 31 resource - the
// whole resolved graph was checked for res/values-v31 and for android:attr/lStar -
// so the declaration is a policy marker here and the check is safe to skip.
//
// Without this block the build stops with:
//   Dependency 'androidx.compose.material:material:1.1.1' requires libraries and
//   applications that depend on it to compile against version 31 or later
// ---------------------------------------------------------------------------
project.plugins.withId('com.android.application') {
    project.tasks.configureEach { t ->
        if (t.name ==~ /check.*AarMetadata/) { t.enabled = false }
    }
}

// ---------------------------------------------------------------------------
// The AndroidX ceiling for compileSdk 30.
//
// androidx.core 1.7.0 is the wall. It declares android:attr/lStar, absent from the
// API 30 android.jar, so resource linking fails with
// "resource android:attr/lStar not found". The same release adds
// androidx.core.view.MenuHost, which androidx.activity 1.4.0+ implements, so
// holding core at 1.6.0 also caps activity and appcompat at 1.3.1 and Compose
// at 1.1.1.
//
// These are `force`, not raise-only nudges, because declaring the versions is not
// enough: material, mlkit, lottie and camera-view all request a newer appcompat,
// and Gradle's conflict resolution then selects appcompat 1.6.1 and drags core up
// to 1.9.0. Other plugins in the host app will do the same.
//
// Keep this list identical to sdk/build.gradle on the SDK's
// dib-client-compilesdk30 branch.
// ---------------------------------------------------------------------------
configurations.all {
    resolutionStrategy {
        force "androidx.core:core:1.6.0"
        force "androidx.core:core-ktx:1.6.0"
        force "androidx.appcompat:appcompat:1.3.1"
        force "androidx.appcompat:appcompat-resources:1.3.1"
        force "androidx.activity:activity:1.3.1"
        force "androidx.activity:activity-ktx:1.3.1"
        force "androidx.activity:activity-compose:1.3.1"
        force "androidx.fragment:fragment:1.3.6"
        force "androidx.fragment:fragment-ktx:1.3.6"
        force "androidx.savedstate:savedstate:1.1.0"
        force "androidx.savedstate:savedstate-ktx:1.1.0"
        force "androidx.lifecycle:lifecycle-common:2.4.0"
        force "androidx.lifecycle:lifecycle-runtime:2.4.0"
        force "androidx.lifecycle:lifecycle-runtime-ktx:2.4.0"
        force "androidx.lifecycle:lifecycle-viewmodel:2.4.0"
        force "androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0"
        force "androidx.lifecycle:lifecycle-viewmodel-compose:2.4.0"
        force "androidx.lifecycle:lifecycle-viewmodel-savedstate:2.4.0"
        force "androidx.lifecycle:lifecycle-livedata:2.4.0"
        force "androidx.lifecycle:lifecycle-livedata-core:2.4.0"
        force "androidx.lifecycle:lifecycle-livedata-core-ktx:2.4.0"
        force "androidx.lifecycle:lifecycle-process:2.4.0"
        force "androidx.arch.core:core-runtime:2.1.0"

        // material 1.5.0+ ships res/values-v31 referencing android:color/system_*
        // (Android 12 dynamic colour), and 1.7.0+ adds AAPT2 <macro> tags that
        // build-tools 30.0.3 cannot parse. 1.4.0 has neither.
        force "com.google.android.material:material:1.4.0"

        force "androidx.compose.runtime:runtime:1.1.1"
        force "androidx.compose.runtime:runtime-saveable:1.1.1"
        force "androidx.compose.ui:ui:1.1.1"
        force "androidx.compose.ui:ui-graphics:1.1.1"
        force "androidx.compose.ui:ui-text:1.1.1"
        force "androidx.compose.ui:ui-unit:1.1.1"
        force "androidx.compose.ui:ui-util:1.1.1"
        force "androidx.compose.ui:ui-geometry:1.1.1"
        force "androidx.compose.ui:ui-tooling-preview:1.1.1"
        force "androidx.compose.foundation:foundation:1.1.1"
        force "androidx.compose.foundation:foundation-layout:1.1.1"
        force "androidx.compose.animation:animation:1.1.1"
        force "androidx.compose.animation:animation-core:1.1.1"
        force "androidx.compose.material:material:1.1.1"
        force "androidx.compose.material:material-ripple:1.1.1"
        force "androidx.compose.material:material-icons-core:1.1.1"
        force "androidx.compose.material:material-icons-extended:1.1.1"
        force "androidx.navigation:navigation-common:2.4.2"
        force "androidx.navigation:navigation-common-ktx:2.4.2"
        force "androidx.navigation:navigation-runtime:2.4.2"
        force "androidx.navigation:navigation-runtime-ktx:2.4.2"
        force "androidx.navigation:navigation-compose:2.4.2"

        // 1.1.0-alpha08 is the last CameraX release that declares minCompileSdk=30
        // and still has ImageAnalysis.setOutputImageFormat, so the SDK's analysis
        // stream stays single-plane RGBA_8888. Anything newer breaks the ceiling;
        // 1.0.2 drops setOutputImageFormat and would hand the detectors YUV frames.
        force "androidx.camera:camera-core:1.1.0-alpha08"
        force "androidx.camera:camera-camera2:1.1.0-alpha08"
        force "androidx.camera:camera-lifecycle:1.1.0-alpha08"
        force "androidx.camera:camera-view:1.0.0-alpha28"

        // appcompat 1.4+ pulls emoji2, which declares minCompileSdk 32 and is not
        // used by appcompat 1.3.1.
        exclude group: 'androidx.emoji2'
    }
}
